name: POS quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check POS shell and JavaScript syntax
        run: |
          bash -n Install_BarRestaurantTicketing.sh Start_BarRestaurantTicketing.sh Stop_BarRestaurantTicketing.sh scripts/install-systemd-user.sh
          find scripts -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - run: npm ci
      - run: npm run check
        env:
          TZ: Europe/Madrid
